<div class="happy-header">
</div>


<div class="col-sm-3">
</div>
<div class="col-sm-6">
  <h2 *ngIf="this.isInjected">SQL Query for dummies</h2>
  <p *ngIf="isInjected"> {{exampleQuery}} <span style="color:red;"> {{queryParam}} </span></p>

  <h2 i18n="@@account.title">Status of your bank accounts</h2>

  <table class="table table-condensed">
    <thead>
      <tr>
        <th i18n="@@account.label">Id</th>
        <th i18n="@@account.status">Status</th>
        <th i18n="@@account.file">Balance</th>
        <th i18n="@@account.file">Rate</th>
        <th i18n="@@account.file">Files</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let account of accounts">
        <td>{{account.idAccount}}</td>
        <td>{{account.type}}</td>
        <td>{{account.balance}}€</td>
        <td>{{account.rate}}</td>
        <td>{{account.document}}</td>
      </tr>
    </tbody>
  </table>
  <h3 class="no-data" *ngIf="!accounts || accounts.length === 0" i18n="@@account.no-data">No data to display</h3>
</div>
